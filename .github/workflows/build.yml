# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

# Builds the DMG. Runs on its own for pull requests (build check + downloadable artifact) and is
# called by release.yml, which attaches what it uploads to a draft release.
#
# Optional repository variables:
#   RUNNER_MACOS   JSON runner label(s) to use instead of macos-26, e.g. '["self-hosted","macOS","ARM64"]'
#   XCODE_VERSION  Xcode to select on the runner, e.g. 26.1 (default: the image's default Xcode)

on:
  pull_request:
    paths:
      - 'MusicManager/**'
      - 'Scripts/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        description: 'pr or release'
        type: string
        required: true
      ref:
        description: 'Git ref to build (default: the triggering ref)'
        type: string
        default: ''
    outputs:
      version:
        description: 'CFBundleShortVersionString baked into the app'
        value: ${{ jobs.build.outputs.version }}
      dmg:
        description: 'File name of the DMG'
        value: ${{ jobs.build.outputs.dmg }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build DMG (macOS arm64)
    runs-on: ${{ vars.RUNNER_MACOS && fromJSON(vars.RUNNER_MACOS) || 'macos-26' }}
    timeout-minutes: 45
    env:
      CHANNEL: ${{ inputs.channel || 'pr' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg: ${{ steps.dmg.outputs.dmg }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Make scripts executable
        # The web uploader drops the executable bit.
        run: chmod +x Scripts/*.sh

      - name: Select Xcode
        if: vars.XCODE_VERSION != ''
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install libmtp libusb xcodegen
          xcodebuild -version
          brew list --versions libmtp libusb | tee bundled-libs.txt

      - name: Determine version
        id: version
        run: |
          version=$(sed -n 's/^ *CFBundleShortVersionString: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' project.yml)
          build=$(sed -n 's/^ *CFBundleVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' project.yml)
          if [ -z "$version" ]; then
            echo "::error file=project.yml::CFBundleShortVersionString not found"
            exit 1
          fi
          if [ "$CHANNEL" != release ]; then
            # Mark pull request builds so About and the diagnostics say where the app came from.
            version="${version}-dev+$(git rev-parse --short=7 HEAD)"
            sed -i '' "s/^\( *CFBundleShortVersionString:\).*/\1 \"${version}\"/" project.yml
          fi
          echo "Version: $version (build $build)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        id: dmg
        run: |
          # Same script a maintainer runs locally: xcodegen, xcodebuild, verify-bundle.sh, hdiutil.
          mkdir -p build dist
          if ! Scripts/build-release.sh > build/xcodebuild.log 2>&1; then
            grep -E 'error:|ERRORE' build/xcodebuild.log || tail -50 build/xcodebuild.log
            exit 1
          fi
          tail -3 build/xcodebuild.log

          # build-release.sh names it after the version: MusicManager-2.3-Beta-3.dmg
          built=$(ls build/MusicManager-*.dmg)
          dmg=$(basename "$built")
          [ "$CHANNEL" = release ] || dmg="MusicManager-dev.dmg"
          mv "$built" "dist/$dmg"
          # Hash from inside dist/ so `shasum -c` works next to the download (no build/ prefix).
          (cd dist && shasum -a 256 "$dmg" > "$dmg.sha256" && cat "$dmg.sha256")
          cp bundled-libs.txt dist/
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musicmanager-${{ env.CHANNEL }}
          path: dist/
          retention-days: ${{ env.CHANNEL == 'pr' && 7 || 30 }}
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log-${{ env.CHANNEL }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
